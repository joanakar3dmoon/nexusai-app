name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'src/**'
      - 'package.json'
      - 'capacitor.config.ts'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build Vite
        run: npm run build

      - name: Init Capacitor Android
        run: npx cap add android || true

      - name: Inject AdMob App ID into AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i 's|<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID".*/>|<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-4903263409458961~5751005760"/>|' "$MANIFEST"
          else
            sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-4903263409458961~5751005760"/>\n    </application>|' "$MANIFEST"
          fi

      - name: Add AdMob dependency to build.gradle
        run: |
          GRADLE="android/app/build.gradle"
          if ! grep -q "play-services-ads" "$GRADLE"; then
            sed -i '/dependencies {/a\    implementation "com.google.android.gms:play-services-ads:23.0.0"' "$GRADLE"
          fi

      - name: Fix Capacitor Android SDK versions
        run: |
          sed -i 's/compileSdk = .*/compileSdk = 34/' android/app/build.gradle || true
          sed -i 's/targetSdk = .*/targetSdk = 34/' android/app/build.gradle || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/' android/app/build.gradle || true
          sed -i 's/targetSdkVersion .*/targetSdkVersion 34/' android/app/build.gradle || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -100

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusAI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "NexusAI APK (latest)"
          body: |
            APK de NexusAI con AdMob completo:
            Banner, Interstitial, Rewarded, Rewarded Interstitial, Native Advanced, App Open.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
