name: Build NexusAI APK (WebView)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/r3dm/nexusai
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi

          cp public/icon-192.png app/src/main/res/mipmap-hdpi/ic_launcher.png 2>/dev/null || true

          cat > settings.gradle << 'EOF'
rootProject.name = "NexusAI"
include ':app'
EOF

          cat > build.gradle << 'EOF'
buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath "com.android.tools.build:gradle:8.2.2" }
}
allprojects { repositories { google(); mavenCentral() } }
EOF

          cat > app/build.gradle << 'EOF'
plugins { id "com.android.application" }
android {
    namespace "com.r3dm.nexusai"
    compileSdk 34
    defaultConfig {
        applicationId "com.r3dm.nexusai"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "2.0"
    }
    buildTypes { debug { minifyEnabled false } }
}
dependencies { implementation "androidx.appcompat:appcompat:1.6.1" }
EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET"/>
    <application
        android:allowBackup="true"
        android:icon="@mipmap/ic_launcher"
        android:label="NexusAI"
        android:theme="@style/Theme.App"
        android:usesCleartextTraffic="true">
        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:configChanges="orientation|screenSize|keyboardHidden">
            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>
        </activity>
    </application>
</manifest>
EOF

          cat > app/src/main/java/com/r3dm/nexusai/MainActivity.java << 'EOF'
package com.r3dm.nexusai;
import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.view.Window;
import android.view.WindowManager;
public class MainActivity extends Activity {
    private WebView webView;
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        requestWindowFeature(Window.FEATURE_NO_TITLE);
        getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
        webView = new WebView(this);
        setContentView(webView);
        WebSettings s = webView.getSettings();
        s.setJavaScriptEnabled(true);
        s.setDomStorageEnabled(true);
        s.setLoadWithOverviewMode(true);
        s.setUseWideViewPort(true);
        webView.setWebViewClient(new WebViewClient());
        webView.loadUrl("https://joanakar3dmoon.github.io/nexusai-app/");
    }
    @Override
    public void onBackPressed() {
        if (webView.canGoBack()) webView.goBack();
        else super.onBackPressed();
    }
}
EOF

          cat > app/src/main/res/values/styles.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style name="Theme.App" parent="Theme.AppCompat.NoActionBar">
        <item name="android:windowBackground">#000000</item>
        <item name="android:statusBarColor">#000000</item>
    </style>
</resources>
EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon -q

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusAI-r3dm-joan-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
