name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'src/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'

permissions:
e

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build Vite modo Capacitor
        run: npx vite build --mode capacitor

      - name: Add Android platform
        run: npx cap add android

      - name: Fix Android SDK versions
        run: |
          sed -i 's/compileSdk = [0-9]*/compileSdk = 34/' android/app/build.gradle || true
          sed -i 's/targetSdk = [0-9]*/targetSdk = 34/' android/app/build.gradle || true

      - name: Inject AdMob App ID
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          ADMOB_ID="ca-app-pub-4903263409458961~5751005760"
          if grep -q "APPLICATION_ID" "$MANIFEST"; then
            sed -i "s|APPLICATION_ID.*/>|APPLICATION_ID\" android:value=\"$ADMOB_ID\"/>|" "$MANIFEST"
          else
            sed -i "s|</application>|  <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_ID\"/>\n</application>|" "$MANIFEST"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusAI-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "NexusAI APK build ${{ github.run_number }}"
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: "APK debug. Instala activando Fuentes desconocidas."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
