name: Build NexusAI APK (WebView)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'android-src/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Setup Android project
        run: |
          mkdir -p app/src/main/java/com/r3dm/nexusai
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          cp android-src/AndroidManifest.xml app/src/main/
          cp android-src/MainActivity.java app/src/main/java/com/r3dm/nexusai/
          cp android-src/styles.xml app/src/main/res/values/
          cp android-src/settings.gradle settings.gradle
          cp android-src/build.gradle.root build.gradle
          cp android-src/build.gradle.app app/build.gradle
          cp public/icon-192.png app/src/main/res/mipmap-hdpi/ic_launcher.png 2>/dev/null || true

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusAI-r3dm-joan-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.0.$(date +%Y%m%d%H%M)"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --title "NexusAI $TAG" \
            --notes "APK WebView: abre la PWA en pantalla completa"
