name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nombre de la app (sin espacios)'
        required: true
        default: 'nexusai-app'
      html_content:
        description: 'HTML en base64 (opcional - usa el index.html si está vacío)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Create app workspace
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          mkdir -p apk-build/www
          
          # Decodificar HTML si viene en base64, si no usar plantilla
          if [ -n "${{ github.event.inputs.html_content }}" ]; then
            echo "${{ github.event.inputs.html_content }}" | base64 -d > apk-build/www/index.html
          else
            cat > apk-build/www/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>NexusAI App</title>
            <style>
              body { background: #0f0f0f; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
              h1 { color: #7c3aed; }
            </style>
          </head>
          <body><h1>NexusAI App</h1><p>Generada por r3dm/joan</p></body>
          </html>
          HTML
          fi

      - name: Init Capacitor project
        working-directory: apk-build
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          npm init -y
          npm install @capacitor/core @capacitor/android
          
          cat > capacitor.config.json << EOF
          {
            "appId": "com.r3dm.${APP_NAME}",
            "appName": "${APP_NAME}",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          
          npx cap add android

      - name: Copy web assets
        working-directory: apk-build
        run: npx cap copy android

      - name: Build debug APK
        working-directory: apk-build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-debug
          path: apk-build/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: APK info
        run: |
          APK_PATH="apk-build/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE=$(du -sh "$APK_PATH" | cut -f1)
            echo "✅ APK generada correctamente"
            echo "📦 Tamaño: $SIZE"
            echo "📥 Descárgala desde la pestaña Artifacts de este workflow"
          else
            echo "❌ Error al generar la APK"
            exit 1
          fi
