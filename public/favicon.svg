<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo negro -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Circuitos de fondo -->
  <g opacity="0.25" stroke="#cc0000" stroke-width="1" fill="none">
    <line x1="30" y1="80" x2="100" y2="80"/><circle cx="100" cy="80" r="3" fill="#cc0000"/>
    <line x1="100" y1="80" x2="100" y2="140"/>
    <line x1="380" y1="60" x2="480" y2="60"/><circle cx="380" cy="60" r="3" fill="#cc0000"/>
    <line x1="420" y1="60" x2="420" y2="130"/>
    <line x1="10" y1="200" x2="70" y2="200"/><circle cx="70" cy="200" r="3" fill="#cc0000"/>
    <line x1="460" y1="180" x2="510" y2="180"/>
    <line x1="50" y1="380" x2="130" y2="380"/><circle cx="50" cy="380" r="3" fill="#cc0000"/>
    <line x1="80" y1="380" x2="80" y2="440"/>
    <line x1="400" y1="400" x2="480" y2="400"/><circle cx="480" cy="400" r="3" fill="#cc0000"/>
    <line x1="450" y1="340" x2="450" y2="400"/>
  </g>
  <g opacity="0.15" stroke="#444" stroke-width="1" fill="none">
    <line x1="0" y1="140" x2="60" y2="140"/>
    <line x1="460" y1="260" x2="512" y2="260"/>
    <line x1="20" y1="300" x2="80" y2="300"/><circle cx="80" cy="300" r="2" fill="#444"/>
    <line x1="80" y1="300" x2="80" y2="350"/>
    <line x1="430" y1="100" x2="512" y2="100"/>
  </g>

  <!-- Círculo exterior rojo principal -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#cc0000" stroke-width="6" filter="url(#glow)"/>

  <!-- Círculo exterior fino -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#550000" stroke-width="1.5"/>

  <!-- Puntos en el borde del círculo -->
  <g fill="#ff3333" filter="url(#glow)">
    <circle cx="256" cy="36" r="4"/>
    <circle cx="476" cy="256" r="4"/>
    <circle cx="256" cy="476" r="4"/>
    <circle cx="36" cy="256" r="4"/>
    <circle cx="412" cy="100" r="3"/>
    <circle cx="412" cy="412" r="3"/>
    <circle cx="100" cy="412" r="3"/>
    <circle cx="100" cy="100" r="3"/>
  </g>

  <!-- Texto NEXUS -->
  <text x="256" y="220" 
        font-family="'Arial Black', 'Impact', sans-serif" 
        font-size="120" font-weight="900"
        text-anchor="middle"
        fill="#cc0000" opacity="0.4"
        dx="4" dy="4">NEXUS</text>
  <text x="256" y="220" 
        font-family="'Arial Black', 'Impact', sans-serif" 
        font-size="120" font-weight="900"
        text-anchor="middle"
        fill="#e8e8e8"
        filter="url(#textGlow)">NEXUS</text>

  <!-- Línea separadora roja -->
  <rect x="106" y="235" width="300" height="7" fill="#cc0000" filter="url(#glow)"/>
  <rect x="126" y="234" width="260" height="1" fill="#ff6666" opacity="0.6"/>

  <!-- Texto AI en rojo -->
  <text x="256" y="340" 
        font-family="'Arial Black', 'Impact', sans-serif" 
        font-size="85" font-weight="900"
        text-anchor="middle"
        fill="#880000" opacity="0.5"
        dx="3" dy="3">AI</text>
  <text x="256" y="340" 
        font-family="'Arial Black', 'Impact', sans-serif" 
        font-size="85" font-weight="900"
        text-anchor="middle"
        fill="#dd1111"
        filter="url(#glow)">AI</text>

  <!-- Subtítulo -->
  <text x="256" y="385" 
        font-family="'Arial', sans-serif" 
        font-size="22" letter-spacing="4"
        text-anchor="middle"
        fill="#555555">INTELLIGENT ASSISTANT</text>

  <!-- Tag r3dm -->
  <text x="256" y="448" 
        font-family="'Arial Black', 'Impact', sans-serif" 
        font-size="32" font-weight="900" letter-spacing="3"
        text-anchor="middle"
        fill="#cc0000"
        filter="url(#glow)">R3DM / JOAN</text>
</svg>
